<style>
:root{--bg:#f4f6fb;--panel:#fff;--ink:#202638;--muted:#697386;--line:#dfe4ee;--accent:#4f46e5;--accent2:#eef2ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:linear-gradient(120deg,#292d69,#6557c8);color:#fff;padding:24px clamp(16px,4vw,48px)}
header h1{margin:0 0 6px;font-size:clamp(22px,3vw,32px)}header p{margin:0;color:#e3e5ff}
main{max-width:1600px;margin:22px auto;padding:0 18px 40px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 3px 14px #1b25500a}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button,.file-label{border:0;border-radius:9px;padding:10px 14px;font-size:14px;font-weight:650;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.primary{background:var(--accent);color:white}.secondary{background:var(--accent2);color:#3730a3}.neutral{background:#eef0f4;color:#30394b}.danger{background:#fff0f0;color:#a52222}
button:hover,.file-label:hover{filter:brightness(.97)}input[type=file]{display:none}
.note{font-size:12px;color:var(--muted);margin:12px 0 0;line-height:1.6}
.status{margin-top:10px;color:#276749;font-size:13px;min-height:1em}
.filters{display:grid;grid-template-columns:repeat(5,minmax(140px,1fr));gap:10px;margin-top:14px}
label.field{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:#50596c}
input[type=text],select{width:100%;border:1px solid #cfd5e2;border-radius:8px;padding:10px 11px;background:#fff;color:var(--ink);font:inherit;min-width:0}
input:focus,select:focus{outline:2px solid #c7d2fe;border-color:var(--accent)}
.stats{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:13px;margin:0 0 12px}
.count{font-size:18px;color:var(--ink);font-weight:800}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;max-height:66vh;background:#fff}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:1100px;font-size:13px}
thead th{position:sticky;top:0;z-index:2;background:#f0f2fa;color:#31394d;text-align:left;white-space:nowrap}
th,td{padding:10px 12px;border-bottom:1px solid #e8ebf2;border-right:1px solid #edf0f5;vertical-align:top}
th:last-child,td:last-child{border-right:0}tbody tr:hover{background:#f8f9ff}
th button{padding:0;background:transparent;color:inherit;border-radius:0;font-size:13px}
td{white-space:pre-wrap;overflow-wrap:anywhere}td:nth-child(1){min-width:125px}td:nth-child(2){min-width:220px;font-weight:650}td:nth-child(3){min-width:230px}td:nth-child(4){min-width:120px}td:nth-child(5){min-width:220px}
.empty{text-align:center;padding:36px;color:var(--muted)}
footer{color:var(--muted);font-size:12px;text-align:center;padding:10px}
@media(max-width:900px){.filters{grid-template-columns:repeat(2,minmax(130px,1fr))}header{padding:20px}}
</style>
</head>

<header>
  <h1>アイマス全曲データベース</h1>
  <p>ブランド・曲名・歌唱メンバー・初出日・備考をまとめて検索</p>
</header>
<main>
  <section class="panel">
    <div class="toolbar">

    <p class="note">

    </p>
    <div class="status" id="status" role="status"></div>
  </section>

  <section class="panel">
    <div class="filters">

      <label class="field">歌唱メンバー／ユニット（部分一致）

      <label class="field">初出日（部分一致）

      </label>
      <label class="field">備考（部分一致）
        <input id="noteFilter" type="text" placeholder="例：ゲーム、CD">
      </label>
    </div>
  </section>

  <section class="panel">
    <div class="stats">

      <div>列名をクリックすると昇順・降順で並べ替えできます。</div>
    </div>

        </tr></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </section>

</main>

  let rows = INITIAL_DATA.map(r => ({...r}));
  let sortKey = 'date', sortDir = 1;
  const $ = id => document.getElementById(id);
  const status = msg => { $('status').textContent = msg; };
  const norm = v => String(v ?? '').normalize('NFKC').toLocaleLowerCase('ja-JP').trim();
  function escapeHtml(v) {
    return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function normalizeRow(obj) {
    const pick = (...names) => {
      for (const name of names) if (obj[name] !== undefined && obj[name] !== null) return String(obj[name]);
      return '';
    };
    return {
      brand: pick('ブランド種別','ブランド','brand','Brand'),
      song: pick('曲名','song','Song','楽曲名'),
      vocal: pick('歌唱メンバー/ユニット','歌唱メンバー／ユニット','歌唱メンバー','ユニット','オリジナル歌唱メンバー','vocal','Vocal'),
      date: pick('初出日','初出','初出年月日','date','Date'),
      note: pick('備考','メモ','note','Note')
    };
  }
  function updateBrands() {
    const select = $('brandFilter'), previous = select.value;
    const brands = [...new Set(rows.map(r => r.brand).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
    select.innerHTML = '<option value="">すべてのブランド</option>' + brands.map(b=>`<option value="${escapeHtml(b)}">${escapeHtml(b)}</option>`).join('');
    if (brands.includes(previous)) select.value = previous;
  }
  function filteredRows() {
    const brand = $('brandFilter').value;
    const filters = {song:norm($('songFilter').value),vocal:norm($('vocalFilter').value),date:norm($('dateFilter').value),note:norm($('noteFilter').value)};
    return rows.filter(r => (!brand || r.brand === brand) &&
      Object.entries(filters).every(([key, q]) => !q || norm(r[key]).includes(q)))
      .slice().sort((a,b) => norm(a[sortKey]).localeCompare(norm(b[sortKey]),'ja',{numeric:true}) * sortDir);
  }
  function render() {
    const result = filteredRows();
    $('count').textContent = result.length.toLocaleString('ja-JP');
    document.querySelectorAll('th button[data-sort]').forEach(btn => {
      const arrow = btn.querySelector('span');
      arrow.textContent = btn.dataset.sort === sortKey ? (sortDir === 1 ? ' ▲' : ' ▼') : '';
    });
    const body = $('tableBody');
    if (!result.length) {
      body.innerHTML = '<tr><td class="empty" colspan="5">該当する曲がありません。検索条件を変えてください。</td></tr>';
      return;
    }
    body.innerHTML = result.map(r => `<tr>${KEYS.map(k=>`<td>${escapeHtml(r[k])}</td>`).join('')}</tr>`).join('');
  }
  function csvEscape(v) {
    const s = String(v ?? '');
    return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  }
  function download(name, content, type) {
    const blob = new Blob([content], {type});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download=name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000);
  }
  function exportCsv(data, filename) {
    const csv = [HEADERS, ...data.map(r=>KEYS.map(k=>r[k]))].map(row=>row.map(csvEscape).join(',')).join('\r\n');
    // Excelで日本語CSVを開いた際の文字化け対策としてBOMを付与
    download(filename, '\uFEFF' + csv, 'text/csv;charset=utf-8');
  }
  $('exportCsvBtn').addEventListener('click',()=>exportCsv(filteredRows(),'imas_song_search_results.csv'));
  $('exportXlsxBtn').addEventListener('click',()=>{
    if(!window.XLSX){status('Excel書き出しにはインターネット接続が必要です。CSV保存をご利用ください。');return;}
    const data=[HEADERS,...filteredRows().map(r=>KEYS.map(k=>r[k]))];
    const ws=XLSX.utils.aoa_to_sheet(data), wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'楽曲一覧');
    XLSX.writeFile(wb,'imas_song_search_results.xlsx');
    status('表示中の検索結果をExcel形式で書き出しました。');
  });
  $('clearBtn').addEventListener('click',()=>{
    $('brandFilter').value=''; ['songFilter','vocalFilter','dateFilter','noteFilter'].forEach(id=>$(id).value=''); render();
  });
  document.querySelectorAll('th button[data-sort]').forEach(btn=>btn.addEventListener('click',()=>{
    if(sortKey===btn.dataset.sort) sortDir*=-1; else {sortKey=btn.dataset.sort;sortDir=1;}
    render();
  }));
  ['brandFilter','songFilter','vocalFilter','dateFilter','noteFilter'].forEach(id=>{
    $(id).addEventListener('input',render); $(id).addEventListener('change',render);
  });
  updateBrands(); render();
})();
</script>
